5. SIGNAL ENGINE

Buat signal engine terpisah.

Output minimal:

{
  "symbol": "XAUUSD",
  "signal": "BUY",
  "confidence": 0.78,
  "score": 72.5,
  "price": 0,
  "timestamp": "",
  "reasons": [],
  "risk_level": "MEDIUM"
}

Signal:

BUY
SELL
HOLD

Jangan menghasilkan BUY/SELL ketika data tidak cukup.

Gunakan scoring system yang dapat dikonfigurasi.

Contoh:

Technical trend       30%
Momentum              15%
Volatility            10%
News sentiment        25%
Macro relevance       10%
Market regime         10%

Bobot harus configurable.

Confidence harus berada pada range:

0.0 - 1.0

Jangan menggunakan confidence palsu atau random.

---

6. RISK MANAGEMENT

Risk management adalah prioritas utama.

Implementasikan:

- maximum risk per trade;
- stop loss;
- take profit;
- ATR-based stop;
- position sizing;
- maximum daily loss;
- maximum drawdown;
- maximum simultaneous positions;
- cooldown;
- spread/slippage assumption;
- risk/reward ratio;
- equity protection.

Contoh configuration:

RISK_PER_TRADE=0.01
MAX_DAILY_LOSS=0.03
MAX_DRAWDOWN=0.15
DEFAULT_RISK_REWARD=2.0

Jangan pernah melakukan position sizing jika stop loss tidak valid.

Jika risk calculation invalid:

NO TRADE

---

7. PAPER TRADING ENGINE

Paper trading harus menjadi mode DEFAULT.

Tidak boleh ada broker order execution.

Architecture:

Signal
  ↓
Risk Engine
  ↓
Paper Order
  ↓
Position
  ↓
PnL
  ↓
Equity
  ↓
Performance Metrics

Implementasikan:

- virtual balance;
- virtual positions;
- entry;
- exit;
- stop loss;
- take profit;
- trailing stop jika configurable;
- fees;
- spread;
- slippage;
- realized PnL;
- unrealized PnL;
- equity curve;
- trade history;
- win rate;
- profit factor;
- expectancy;
- Sharpe-like metric;
- max drawdown.

Engine harus bisa berjalan terus-menerus.

Tambahkan:

START
STOP
STATUS
RESET

endpoint/API.

Pastikan thread/background task shutdown dengan benar.

Jangan membuat infinite loop yang menyebabkan FastAPI hang.

Gunakan async task/background worker dengan lifecycle management yang benar.

---

8. HISTORICAL BACKTEST

Implementasikan backtesting engine.

Harus mendukung:

- historical OHLC;
- signal generation;
- transaction cost;
- spread;
- slippage;
- stop loss;
- take profit;
- position sizing;
- equity curve;
- trade list.

Hindari look-ahead bias.

PENTING:

Signal pada candle N tidak boleh menggunakan informasi dari candle masa depan.

Pisahkan:

train
validation
test

jika digunakan untuk parameter research.

---

9. RESEARCH ENGINE

Pertahankan dan tingkatkan research module.

Tambahkan:

- parameter sweep;
- walk-forward analysis;
- bootstrap;
- Monte Carlo trade shuffle;
- sensitivity analysis;
- out-of-sample testing;
- drawdown analysis.

Jangan menyebut strategy "profitable" hanya berdasarkan satu backtest.

Tambahkan warning:

Past performance does not guarantee future results.


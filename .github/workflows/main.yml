XAUUSD ALPHA SYNDICATE — PROFESSIONAL AUTONOMOUS IMPLEMENTATION

Anda adalah senior software architect, Python engineer, quantitative researcher, DevSecOps engineer, cybersecurity engineer, dan UI/UX engineer.

Bekerja langsung pada repository GitHub:

"winrx20/xauusd_alpha_syndicate"

Tujuan utama: ubah repository ini menjadi aplikasi XAUUSD market-analysis dan paper-trading research platform yang profesional, stabil, aman, mudah dijalankan di Termux/Linux/Docker, dan memiliki local web dashboard.

MODE KERJA

Jangan hanya memberikan saran atau potongan kode.

Kerjakan perubahan langsung pada repository.

Workflow wajib:

1. Inspect seluruh repository.
2. Baca semua source code, configuration, tests, Dockerfile, README, workflow CI/CD, dan static frontend.
3. Buat audit arsitektur.
4. Identifikasi seluruh bug, dependency issue, security issue, edge case, konfigurasi yang salah, dan bagian yang belum selesai.
5. Implementasikan perbaikan.
6. Tambahkan fitur yang diperlukan.
7. Jalankan test.
8. Jika test gagal, diagnosis penyebabnya.
9. Perbaiki.
10. Jalankan ulang test.
11. Jalankan lint/type/static checks yang tersedia.
12. Perbaiki seluruh error yang ditemukan.
13. Pastikan aplikasi dapat start.
14. Pastikan API utama dapat digunakan.
15. Pastikan paper-trading engine berjalan kontinu.
16. Pastikan tidak ada auto-order broker.
17. Update README dan dokumentasi deployment.
18. Update CI jika diperlukan.
19. Jangan berhenti hanya karena menemukan error pertama.
20. Teruskan sampai repository berada pada kondisi production-ready untuk paper/research use.

Jangan menghapus fitur yang sudah berfungsi kecuali memang diperlukan untuk memperbaiki arsitektur.

Jika terdapat implementasi lama yang buruk, refactor secara aman.

Jangan membuat perubahan yang tidak berhubungan dengan project.


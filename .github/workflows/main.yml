2. XAUUSD MARKET DATA

Prioritaskan integrasi harga.

Implementasikan market-data layer yang:

- mengambil data XAUUSD/Gold yang tersedia secara reliable;
- mendukung historical OHLCV;
- mendukung interval/timeframe;
- memiliki timeout;
- memiliki retry;
- menangani provider failure;
- melakukan validation data;
- menangani missing candles;
- menangani NaN;
- tidak crash ketika provider sedang unavailable;
- menyediakan fallback yang aman jika memungkinkan.

Jangan mengarang harga.

Pisahkan provider dari strategy sehingga provider dapat diganti kemudian.

Contoh interface:

class MarketDataProvider:
    def get_latest(self, symbol: str):
        ...

    def get_history(self, symbol: str, interval: str, period: str):
        ...

Default symbol harus configurable.

Gunakan XAUUSD/Gold sebagai instrument utama.

---

3. TECHNICAL ANALYSIS

Implementasikan indikator yang relevan:

- EMA
- SMA
- RSI
- MACD
- ATR
- Bollinger Bands
- momentum
- volatility
- trend detection

Jangan membuat signal hanya berdasarkan satu indikator.

Semua indikator harus:

- menangani insufficient data;
- tidak menghasilkan NaN sebagai signal valid;
- memiliki unit tests;
- menggunakan closed candles untuk signal confirmation jika sesuai.


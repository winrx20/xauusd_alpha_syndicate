4. NEWS ANALYSIS

Bangun news-analysis pipeline.

Sumber berita harus configurable.

Pipeline:

News Source
    ↓
Fetch
    ↓
Normalize
    ↓
Deduplicate
    ↓
Timestamp validation
    ↓
Text extraction
    ↓
Sentiment
    ↓
Gold relevance
    ↓
Impact score
    ↓
Market signal contribution

News signal harus memperhatikan faktor seperti:

- USD strength
- Federal Reserve
- interest rates
- inflation
- CPI
- PCE
- NFP
- employment
- Treasury yields
- geopolitical risk
- central banks
- recession risk
- risk-off/risk-on

Jangan menganggap semua berita bullish/bearish secara sederhana.

Berikan:

sentiment_score
relevance_score
impact_score
confidence
direction
timestamp
source

Hindari duplicate news.

Jika news provider gagal, aplikasi tetap harus berjalan menggunakan market data saja.

